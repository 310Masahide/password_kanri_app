<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ログイン画面（拡張機能のデモ用）</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
  <div class="card shadow-sm mx-auto mt-5" style="max-width: 420px;">
    <div class="card-body p-4">
      <h1 class="h4 mb-2 text-center">デモ用のログイン画面</h1>
      <p class="text-muted small text-center mb-4">Chrome 拡張機能の自動入力を試すためのページです。送信しても、どこにも送られません。</p>
      <form id="demo-form">
        <div class="mb-3">
          <label class="form-label" for="email">メールアドレス</label>
          <input class="form-control" type="email" id="email" name="email" autocomplete="off">
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">パスワード</label>
          <input class="form-control" type="password" id="password" name="password" autocomplete="off">
        </div>
        <button class="btn btn-primary w-100" type="submit">ログイン</button>
      </form>
      <p id="result" class="text-success text-center mt-3"></p>
    </div>
  </div>
  <script>
    document.getElementById("demo-form").addEventListener("submit", (event) => {
      event.preventDefault()
      document.getElementById("result").textContent = "デモ用のページなので、送信はしません。入力できていれば成功です。"
    })
  </script>
</body>
</html>
