<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>設定 - パスワード管理アプリ 連携</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="options">
  <h1>設定</h1>

  <form id="settings">
    <label for="server">アプリの URL</label>
    <select id="server">
      <option value="https://password-kanri-app.onrender.com">公開サイト（Render）</option>
      <option value="http://localhost:3000">手元（localhost:3000）</option>
    </select>

    <label for="token">トークン</label>
    <input id="token" type="password" autocomplete="off" required>
    <p class="hint">アプリの「拡張機能」の画面で発行したトークンを貼り付けます。</p>

    <div class="buttons">
      <button type="submit">保存</button>
      <button type="button" id="test" class="secondary">接続テスト</button>
    </div>
    <p id="message"></p>
  </form>

  <script src="options.js"></script>
</body>
</html>
